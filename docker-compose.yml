services:
  cariddi:
    image: ghcr.io/jbkunama1/hai.cariddi:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Berlin
      SCAN_ENABLED: ${SCAN_ENABLED:-false}
      CARIDDI_TARGETS: ${CARIDDI_TARGETS:-}
      CARIDDI_ARGS_JSON: '${CARIDDI_ARGS_JSON:-["-c","5","-d","1","-md","2","-t","10","-e","-json"]}'
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-0}
      SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-1800}
    volumes:
      - cariddi_data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  cariddi_data:
