name: Build and publish GHCR
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and Compose
        run: |
          python -m py_compile runner.py web.py
          ADMIN_PASSWORD=ci-check-only-password docker compose config --quiet
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cariddi:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke tests without scans
        run: |
          docker run --rm --network none --entrypoint cariddi cariddi:test -version
          docker run --rm --network none cariddi:test --selftest
          docker run --rm --network none --entrypoint sh cariddi:test -c 'test -s /usr/share/cariddi/source/LICENSE'
          docker run -d --name ui -e ADMIN_PASSWORD=ci-check-only-password -p 18080:8080 cariddi:test
          sleep 4
          curl -fsS http://127.0.0.1:18080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = 303
          docker rm -f ui
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/jbkunama1/hai.cariddi
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=https://github.com/jbkunama1/hAI.cariddi
      - name: Publish multi-architecture image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
